# Configuration OPTIMISÉE pour NVIDIA RTX 4070 Ti
# 12 GB VRAM | Architecture Ada Lovelace | 7680 CUDA cores
#
# Cette config tire le maximum de ta carte graphique pour un traitement ultra-rapide
# Temps estimé pour 1h de vidéo -> 15min highlights: ~6-8 minutes

analysis:
  # Segments courts = analyse plus précise
  segment_duration_seconds: 5

  # Seuils STRICTS pour ACTION PURE (PvP/combat uniquement)
  audio_intensity_threshold: 0.65  # 0.6 → 0.65 : TRÈS intense seulement (gunfire/explosions)
  scene_change_threshold: 20.0     # 25 → 20 : mouvements RAPIDES (pas craft statique)

  # Whisper sur GPU = TRÈS rapide avec RTX 4070 Ti
  enable_whisper: true
  whisper_model: base  # 'base' optimal même avec GPU puissant

  score_weights:
    audio: 0.65       # 0.60 → 0.65 : MAX priorité sons intenses (kills/tirs)
    visual: 0.30      # Garde : changements scène rapides
    transcription: 0.05  # 0.10 → 0.05 : QUASI IGNORÉ (évite craft/talk)

  # Poids avec LLaVA (compréhension sémantique activée)
  score_weights_llava:
    semantic: 0.50    # LLaVA COMPREND le contexte (PvP/PvE/looting/craft)
    audio: 0.25       # Pics sonores (support)
    visual: 0.20      # Changements scène (support)
    transcription: 0.05  # Mots-clés (minimal)

# ============================================================================
# LLAVA - ANALYSE SÉMANTIQUE (Compréhension par LLM+Vision)
# ============================================================================
llava:
  # Activer LLaVA pour comprendre réellement les scènes
  # Au lieu de juste mesurer des pics audio/visuels, LLaVA COMPREND:
  # - PvP combat vs PvE vs looting vs crafting
  # - Intensité réelle (1v1, 1v2+, clutch)
  # - Position dans séquence (start/peak/end)
  enabled: true

  # Modèle à utiliser (via Ollama)
  # Options : llava:7b (recommandé), llava:13b (plus précis, plus lent)
  model: llava:7b

  # Batch size pour traitement parallèle
  # RTX 4070 Ti peut gérer 5-10 frames en parallèle
  batch_size: 5

  # Temperature pour génération (0.0-1.0)
  # Plus bas = plus déterministe, plus haut = plus créatif
  temperature: 0.3

  # IMPORTANT: Temps estimé avec LLaVA
  # Pour 60 min de vidéo = 724 segments = 724 frames
  # Batch de 5 frames : 145 batches × 3s = ~7 minutes
  # Temps total avec LLaVA : ~22 minutes (vs 15 min sans)

editing:
  # ===================================================================
  # FUSION ULTRA-AGRESSIVE POUR FPS (COMBAT COMPLET!)
  # ===================================================================
  # Capture les séquences d'action COMPLÈTES : début → milieu → fin
  # Optimisé pour FPS rapide type Apex/Warzone/Valorant
  merge_consecutive_segments: true
  merge_max_gap: 25              # 15 → 25s : fusionne même avec gros gaps
  merge_min_score: 0.15          # 0.25 → 0.15 : accepte segments moyens entre kills

  # Filtrage spatial minimal (fusion gère les séquences)
  min_gap_between_segments: 10   # 20 → 10s : clips très proches OK

  # Contexte réduit (la fusion capture déjà tout)
  context_before_seconds: 1      # 2 → 1s
  context_after_seconds: 2       # 3 → 2s

  # Contraintes de durée pour FPS
  min_segment_duration: 3        # 2 → 3s (micro-moments OK)
  max_segment_duration: 120      # 90 → 120s (combats longs entiers)

  # Transitions professionnelles
  use_transitions: true
  transition_duration: 0.5
  transition_type: crossfade

output:
  # Durée cible
  target_duration_minutes: 15

  # Qualité maximale compatible YouTube
  quality: 1080p
  fps: 60            # 60fps pour gaming fluide

  # Codec (sera auto-remplacé par h264_nvenc)
  codec: libx264
  audio_codec: aac

  # ===================================================================
  # PARAMÈTRES NVENC OPTIMISÉS POUR RTX 4070 Ti
  # ===================================================================

  # Preset NVENC:
  # - 'hq' = High Quality (RECOMMANDÉ pour YouTube)
  # - 'bd' = Blu-ray Disc quality (si tu veux le max absolu)
  preset: hq

  # CRF/CQ (Constant Quality):
  # RTX 4070 Ti peut encoder à haute qualité sans ralentissement
  # - 18 = Qualité exceptionnelle (YouTube premium)
  # - 20 = Excellente qualité (recommandé)
  # - 23 = Bonne qualité standard
  crf: 20

  # Bitrate audio haute qualité
  audio_bitrate: 192

  # Intro/outro (optionnel)
  intro_path: ""
  outro_path: ""

performance:
  # ===================================================================
  # ACTIVATION GPU - CRITICAL
  # ===================================================================
  use_gpu: true       # Active CUDA + NVENC

  # Cache pour éviter de re-analyser
  use_cache: true

  # Threads CPU (pour fallback uniquement)
  # RTX 4070 Ti gère tout sur GPU, mais garde 4 threads CPU en backup
  num_threads: 4

  # Chunks audio - 12GB VRAM permet de gros chunks
  audio_chunk_size: 120  # Plus gros = moins d'I/O = plus rapide

advanced:
  # Score minimum STRICT - PvP/combat intense uniquement
  min_score_threshold: 0.35  # 0.3 → 0.35 : filtre craft/base/talk

  # NOUVEAU: Filtre segments statiques (craft/base)
  min_visual_score: 0.20     # Retire segments avec peu de mouvement visuel

  # Filtrage silences AGRESSIF
  remove_silent_segments: true
  silence_threshold_db: -35  # -40 → -35 : retire plus de moments calmes

  # Préférence segments
  prefer_longer_segments: false

  # Boost transcription
  transcription_boost_factor: 1.2

# ============================================================================
# PERFORMANCE RTX 4070 Ti - BENCHMARKS ATTENDUS
# ============================================================================
#
# Pour 1h de vidéo source -> 15min de highlights:
#
# 1. Analyse Whisper (CUDA):        ~45-90 secondes  ⚡
# 2. Analyse visuelle (OpenCV):     ~30 secondes
# 3. Sélection segments:             ~5 secondes
# 4. Extraction clips:               ~30 secondes
# 5. Encodage NVENC (h264_nvenc):    ~3-4 minutes    ⚡
#
# TOTAL: ~6-8 minutes (au lieu de 35-50 min sans GPU)
#
# Indicateurs de succès:
# ----------------------
# ✅ Logs: "🎮 Utilisation de l'accélération GPU NVIDIA (h264_nvenc)"
# ✅ Whisper: ~1-2 min pour 1h d'audio (pas 10-15 min)
# ✅ Encodage: 120-150 it/s (pas 7-11 it/s)
# ✅ nvidia-smi: GPU 80-95% (pas 4%)
#
# ============================================================================
# OPTIMISATIONS RTX 4070 Ti SPÉCIFIQUES
# ============================================================================
#
# Architecture Ada Lovelace (4000 series):
# - Encodeurs NVENC de 8ème génération (ultra-rapides)
# - Support AV1 hardware (pas encore utilisé ici, mais disponible)
# - 12 GB VRAM permet d'encoder plusieurs streams en parallèle
# - Tensor cores pour Whisper accéléré
#
# Cette config utilise:
# 1. NVENC 8th gen avec preset 'hq' (balance vitesse/qualité)
# 2. CUDA pour Whisper (utilise Tensor cores automatiquement)
# 3. Gros chunks audio (12GB VRAM permet)
# 4. CQ 20 pour qualité exceptionnelle sans ralentir
#
# Variantes:
# ----------
# Pour MAXIMUM vitesse (preview): preset: fast, crf: 23
# Pour MAXIMUM qualité: preset: bd, crf: 18
# Pour 4K: quality: 4k (la 4070 Ti peut!)
#
# ============================================================================
# COMPARAISON CPU vs GPU (RTX 4070 Ti)
# ============================================================================
#
#                     CPU (16 threads)    GPU (RTX 4070 Ti)    Gain
# Whisper (1h)        15-20 min          45-90 sec            ~15x
# Encodage (15min)    20-30 min          3-4 min              ~7x
# TOTAL               35-50 min          6-8 min              ~6x
#
# La 4070 Ti est une BÊTE pour l'édition vidéo! 🔥
# ============================================================================
