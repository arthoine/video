# Configuration par défaut de StreamHighlightAI
# Personnalisez ces valeurs selon vos besoins

# ============================================================================
# ANALYSE VIDÉO
# ============================================================================
analysis:
  # Durée de chaque segment analysé (en secondes)
  # Plus petit = plus précis mais plus lent
  segment_duration_seconds: 5

  # Seuil d'intensité audio (0.0 à 1.0)
  # Plus bas = plus de segments détectés (risque de faux positifs)
  # Plus haut = seulement les moments très intenses
  audio_intensity_threshold: 0.7

  # Seuil de détection des changements de scène (0.0 à 100.0)
  # Plus bas = détecte plus de changements (action rapide)
  scene_change_threshold: 30.0

  # Activer la transcription audio avec Whisper
  # Désactiver si vous voulez accélérer le traitement
  enable_whisper: true

  # Modèle Whisper à utiliser
  # Options: tiny, base, small, medium, large
  # tiny: très rapide, moins précis
  # base: bon compromis vitesse/précision (RECOMMANDÉ)
  # medium/large: meilleure précision mais beaucoup plus lent
  whisper_model: base

  # Pondération des scores (total doit faire ~1.0)
  score_weights:
    audio: 0.50      # Intensité sonore (kills, réactions)
    visual: 0.35     # Changements de scène (action rapide)
    transcription: 0.15  # Mots-clés détectés

# ============================================================================
# MONTAGE VIDÉO
# ============================================================================
editing:
  # ===================================================================
  # FUSION INTELLIGENTE DE SEGMENTS (NOUVEAU!)
  # ===================================================================
  # Active la fusion automatique des segments proches pour capturer
  # des séquences d'action complètes (ex: début combat → 1v3 → looting)
  merge_consecutive_segments: true

  # Écart maximum entre segments pour les fusionner (secondes)
  # Ex: si 2 segments sont à 15s d'intervalle et ont de bons scores,
  # ils seront fusionnés en 1 seul clip continu
  merge_max_gap: 15

  # Score minimum pour qu'un segment soit fusionné avec le précédent
  # Plus bas = plus de fusion, plus haut = fusion sélective
  merge_min_score: 0.25

  # Écart minimum entre deux segments (en secondes)
  # Évite d'avoir des clips trop rapprochés
  # (Réduit car la fusion intelligente gère mieux les séquences)
  min_gap_between_segments: 20

  # Contexte ajouté avant chaque moment fort (en secondes)
  # Permet de voir ce qui mène au moment clé
  context_before_seconds: 2

  # Contexte ajouté après chaque moment fort (en secondes)
  # Permet de voir la suite du moment clé
  context_after_seconds: 3

  # Durée minimale d'un segment (en secondes)
  # Les segments plus courts sont ignorés
  # (Réduit pour permettre des micro-moments intéressants)
  min_segment_duration: 2

  # Durée maximale d'un segment (en secondes)
  # Les segments plus longs sont tronqués
  # (Augmenté pour permettre de longues séquences d'action)
  max_segment_duration: 90

  # Utiliser des transitions entre les clips
  use_transitions: true

  # Durée des transitions (en secondes)
  # 0 = cut direct, > 0 = crossfade
  transition_duration: 0.5

  # Type de transition
  # Options: crossfade, cut, smooth_cut
  transition_type: crossfade

# ============================================================================
# EXPORT VIDÉO
# ============================================================================
output:
  # Durée cible de la vidéo finale (en minutes)
  # L'algorithme sélectionnera les meilleurs segments jusqu'à atteindre cette durée
  target_duration_minutes: 15

  # Qualité de sortie
  # Options: 720p, 1080p, 4k
  quality: 1080p

  # Framerate de sortie
  # 60 recommandé pour les jeux FPS
  fps: 60

  # Codec vidéo
  # libx264: compatibilité maximale, bonne qualité
  # h264_nvenc: accélération NVIDIA (si GPU disponible)
  codec: libx264

  # Codec audio
  # aac: standard, compatible YouTube
  audio_codec: aac

  # Bitrate audio (en kbps)
  audio_bitrate: 192

  # Preset d'encodage
  # CPU (x264): ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
  # GPU (NVENC): fast, medium, slow, hq, bd, ll, llhq, lossless
  # Si GPU activé: 'hq' sera utilisé automatiquement (high quality)
  # Sinon: 'faster' pour CPU
  preset: faster

  # CRF (Constant Rate Factor) - qualité vidéo
  # 0 = lossless (énorme), 18 = très haute qualité, 23 = défaut, 28 = basse qualité
  # 23 recommandé pour YouTube (bonne qualité, encodage rapide)
  crf: 23

  # Chemin vers une vidéo d'intro (optionnel)
  # Laissez vide pour désactiver
  intro_path: ""

  # Chemin vers une vidéo d'outro (optionnel)
  # Laissez vide pour désactiver
  outro_path: ""

# ============================================================================
# PERFORMANCE
# ============================================================================
performance:
  # Utiliser le GPU si disponible (CUDA)
  # Accélère considérablement Whisper et l'export vidéo
  # NVIDIA 4070 Ti = 5-10min au lieu de 20-30min
  use_gpu: true

  # Utiliser le cache des analyses
  # Permet de réutiliser les analyses précédentes
  use_cache: true

  # Nombre de threads pour le traitement (0 = auto-detect, 4-8 recommandé)
  # Plus de threads = encodage plus rapide (mais rendements décroissants après 8)
  num_threads: 4

  # Taille des chunks pour le traitement audio (en secondes)
  # Plus petit = moins de RAM mais plus lent
  audio_chunk_size: 60

# ============================================================================
# FILTRES AVANCÉS (Expérimental)
# ============================================================================
advanced:
  # Score minimum pour qu'un segment soit considéré
  # Augmentez pour avoir moins de segments mais de meilleure qualité
  min_score_threshold: 0.3

  # Détection de silences (retire les segments avec peu d'audio)
  remove_silent_segments: true

  # Seuil de silence (dB)
  silence_threshold_db: -40

  # Préférer les segments plus longs
  # true: favorise les longues séquences
  # false: tous les segments ont le même poids
  prefer_longer_segments: false

  # Boost pour les segments avec transcription positive
  # Multiplie le score si des mots-clés sont détectés
  transcription_boost_factor: 1.2
