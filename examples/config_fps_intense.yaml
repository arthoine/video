# Configuration optimisée pour streams FPS intenses
# (Valorant, CS:GO, Call of Duty, Apex Legends)

# Priorité sur l'audio (kills, gunfights) et le visuel rapide
analysis:
  segment_duration_seconds: 4  # Segments courts pour précision
  audio_intensity_threshold: 0.65  # Plus sensible aux gunfights
  scene_change_threshold: 25.0  # Détecte l'action rapide
  enable_whisper: true
  whisper_model: base

  score_weights:
    audio: 0.55      # Poids élevé pour les sons de combat
    visual: 0.40     # Action rapide = changements visuels
    transcription: 0.05  # Moins important pour FPS

editing:
  min_gap_between_segments: 25  # Peut être plus rapproché
  context_before_seconds: 2
  context_after_seconds: 3
  min_segment_duration: 4
  max_segment_duration: 25
  use_transitions: true
  transition_duration: 0.3  # Transitions rapides

output:
  target_duration_minutes: 15
  quality: 1080p
  fps: 60  # Important pour FPS
  preset: medium
  crf: 18

performance:
  use_gpu: true
  use_cache: true

advanced:
  min_score_threshold: 0.4  # Plus sélectif
  remove_silent_segments: true
