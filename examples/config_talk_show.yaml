# Configuration optimisée pour streams type talk/discussion
# (Just Chatting, podcasts gaming, interviews)

# Priorité sur la transcription et les réactions vocales
analysis:
  segment_duration_seconds: 8  # Segments plus longs pour dialogue
  audio_intensity_threshold: 0.5  # Plus sensible aux variations vocales
  scene_change_threshold: 40.0  # Moins important (peu d'action visuelle)
  enable_whisper: true
  whisper_model: medium  # Meilleure transcription

  score_weights:
    audio: 0.35      # Variations vocales
    visual: 0.15     # Peu pertinent pour talk
    transcription: 0.50  # Le plus important!

editing:
  min_gap_between_segments: 45  # Plus d'espace entre moments
  context_before_seconds: 3  # Plus de contexte pour comprendre
  context_after_seconds: 4
  min_segment_duration: 8
  max_segment_duration: 45  # Segments plus longs OK
  use_transitions: true
  transition_duration: 0.8  # Transitions douces

output:
  target_duration_minutes: 20  # Plus long car dialogue
  quality: 1080p
  fps: 30  # 30fps suffisant pour talk
  preset: medium
  crf: 20

performance:
  use_gpu: true
  use_cache: true

advanced:
  min_score_threshold: 0.25  # Moins sélectif
  remove_silent_segments: true
  silence_threshold_db: -35
  transcription_boost_factor: 1.5  # Boost élevé sur transcription
