# Configuration qualité maximale pour YouTube
# Utilisez cette config pour vos meilleures vidéos
# ATTENTION: Traitement beaucoup plus long!

analysis:
  segment_duration_seconds: 3  # Précision maximale
  audio_intensity_threshold: 0.7
  scene_change_threshold: 30.0
  enable_whisper: true
  whisper_model: medium  # Ou large si vous avez le temps

  score_weights:
    audio: 0.50
    visual: 0.35
    transcription: 0.15

editing:
  min_gap_between_segments: 35
  context_before_seconds: 3
  context_after_seconds: 4
  min_segment_duration: 6
  max_segment_duration: 30
  use_transitions: true
  transition_duration: 0.5

output:
  target_duration_minutes: 18
  quality: 4k  # Export en 4K
  fps: 60
  preset: slower  # Meilleure compression
  crf: 16  # Qualité très élevée

  # Paramètres audio haute qualité
  audio_codec: aac
  audio_bitrate: 320  # Bitrate maximal

performance:
  use_gpu: true  # FORTEMENT recommandé!
  use_cache: true
  num_threads: 0  # Tous les cores

advanced:
  min_score_threshold: 0.35
  remove_silent_segments: true
  prefer_longer_segments: true  # Favorise les longues séquences
  transcription_boost_factor: 1.2

# Notes:
# - Temps de traitement estimé: 2-4x plus long que la config par défaut
# - Nécessite un GPU puissant pour 4K
# - Taille de fichier finale: 2-3x plus grande
# - Idéal pour contenu premium/montage professionnel
